<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="fundo">
        <div class="calculadora">
            <h1>Calculadora</h1>
            <p id="resultado"></p>
            <div class="grid">
                <div class="grid grid-rows-1">
                    <button>C</button>
                    <button></button>
                    <button>/</button>
                    <button>X</button>
                </div>
                <div class="grid grid-rows-2">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>-</button>
                </div>
                <div class="grid grid-rows-3">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>+</button>
                </div>
                <div class="grid grid-rows-4">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
        
                </div>
            </div>
        </div>
    </div>
</body>

</html>
