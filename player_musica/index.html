<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Música</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <img src="imagens/capa.jfif" alt="Capa da música">

        <div class="descricao">
            <h2>Nome da Música</h2>
            <i>Nome do Artista</i>
        </div>

        <div class="duracao">
            <div class="barra" id="barra">
                <progress value="0" max="100"></progress>
                <div class="ponto"></div>
            </div>

            <div class="tempo">
                <p class="inicio">0:00</p>
                <p class="fim">0:00</p>
            </div>
        </div>

        <div class="player">
            <span class="botao-voltar">
                <img src="imagens/skip_previous.png" alt="Voltar">
            </span>

            <span class="botao-pley">
                <img src="imagens/play.png" alt="Play">
            </span>

            <span class="botao-pause">
                <img src="imagens/pause.png" alt="Pause">
            </span>

            <span class="botao-avancar">
                <img src="imagens/skip_next.png" alt="Avançar">
            </span>
        </div>

        <audio></audio>
    </div>

    <script src="script.js"></script>
</body>

</html>
